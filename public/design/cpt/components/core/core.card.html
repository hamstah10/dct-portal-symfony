<!-- @dsCard group="Components" viewport="700x520" name="Core — buttons, badges, tags" subtitle="Button · IconButton · Badge · Tag · Logo" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:22px;background:var(--bg);font-family:var(--font-sans);}
  .sec{margin-bottom:20px;}
  .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-subtle);margin-bottom:10px;}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="text/babel">
    const { Button, IconButton, Badge, Tag, Logo } = window.ChiptuningfileDesignSystem_3beb42;
    const I = (n) => <i data-lucide={n}></i>;
    function Demo(){
      return (
        <div>
          <div className="sec">
            <div className="lbl">Button — variants</div>
            <div className="row">
              <Button variant="primary" iconLeft={I('upload')}>Datei hochladen</Button>
              <Button variant="secondary" iconLeft={I('search')}>Fahrzeug suchen</Button>
              <Button variant="ghost">Mehr erfahren</Button>
              <Button variant="danger" iconLeft={I('trash-2')}>Löschen</Button>
            </div>
          </div>
          <div className="sec">
            <div className="lbl">Button — sizes &amp; states</div>
            <div className="row">
              <Button size="sm">Small</Button>
              <Button size="md">Medium</Button>
              <Button size="lg" iconRight={I('arrow-right')}>Large</Button>
              <Button loading>Lädt…</Button>
              <Button disabled>Disabled</Button>
            </div>
          </div>
          <div className="sec">
            <div className="lbl">IconButton</div>
            <div className="row">
              <IconButton label="Menü" variant="ghost">{I('menu')}</IconButton>
              <IconButton label="Filter" variant="outline">{I('sliders-horizontal')}</IconButton>
              <IconButton label="Warenkorb" variant="solid">{I('shopping-cart')}</IconButton>
            </div>
          </div>
          <div className="sec">
            <div className="lbl">Badge</div>
            <div className="row">
              <Badge solid>Stage 1</Badge>
              <Badge tone="success" dot>Geliefert</Badge>
              <Badge tone="warning">In Bearbeitung</Badge>
              <Badge tone="danger" dot>Fehlgeschlagen</Badge>
              <Badge tone="info">Diesel</Badge>
              <Badge tone="accent">+38 PS</Badge>
            </div>
          </div>
          <div className="sec">
            <div className="lbl">Tag</div>
            <div className="row">
              <Tag active onRemove={()=>{}}>Diesel</Tag>
              <Tag onRemove={()=>{}}>BMW</Tag>
              <Tag>Stage 1</Tag>
            </div>
          </div>
          <div className="sec">
            <div className="lbl">Logo</div>
            <div className="row"><Logo size="md" assetBase="../../" /></div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
    setTimeout(()=>window.lucide&&window.lucide.createIcons(),60);
  </script>
</body>
</html>

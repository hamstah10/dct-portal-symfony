<!-- @dsCard group="Components" viewport="700x540" name="Forms — inputs & controls" subtitle="Input · Select · Checkbox · Radio · Switch" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:24px;background:var(--bg);font-family:var(--font-sans);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:640px;}
  .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-subtle);margin:0 0 12px;}
  .stack{display:flex;flex-direction:column;gap:14px;}
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="text/babel">
    const { Input, Select, Checkbox, Radio, Switch } = window.ChiptuningfileDesignSystem_3beb42;
    function Demo(){
      const [stage,setStage]=React.useState('1');
      const [dark,setDark]=React.useState(true);
      return (
        <div className="grid">
          <div>
            <p className="lbl">Text · Select</p>
            <div className="stack">
              <Input label="Fahrgestellnummer (VIN)" placeholder="WVWZZZ…" required prefix={<i data-lucide="hash"></i>} />
              <Input label="Wunschleistung" suffix="PS" defaultValue="285" />
              <Input label="E-Mail" error="Bitte gültige Adresse eingeben" defaultValue="fahrer@" />
              <Select label="Marke" placeholder="Marke wählen" options={['Audi','BMW','Mercedes-Benz','VW']} />
            </div>
          </div>
          <div>
            <p className="lbl">Choice · Toggle</p>
            <div className="stack">
              <Checkbox label="EGR / DPF entfernen" defaultChecked />
              <Checkbox label="AdBlue deaktivieren" />
              <Radio name="st" value="1" label="Stage 1 — Serie auf Optimum" checked={stage==='1'} onChange={()=>setStage('1')} />
              <Radio name="st" value="2" label="Stage 2 — mit Hardware" checked={stage==='2'} onChange={()=>setStage('2')} />
              <Switch label="Dunkles Design" checked={dark} onChange={e=>setDark(e.target.checked)} />
              <Switch label="Eco-Tuning" />
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
    setTimeout(()=>window.lucide&&window.lucide.createIcons(),60);
  </script>
</body>
</html>

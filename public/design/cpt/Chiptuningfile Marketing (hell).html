  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Saira Condensed';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"64c833df-a452-46eb-8f0f-2d7ae48d6440\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Saira Condensed';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"5c6bd47f-86b6-481f-a11d-cbcce4da252a\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Saira Condensed';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"f7c41a37-ace2-42c3-a825-5b37164d552a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ============================================================\n   COLORS — Chiptuningfile Design System\n   Automotive-performance palette: carbon neutrals, ignition\n   accent, telemetry + dyno semantic colors. Light + dark.\n   ============================================================ */\n\n:root {\n  /* --- Carbon neutral ramp (cool graphite) --- */\n  --carbon-25:  #F8FAFB;\n  --carbon-50:  #F1F3F6;\n  --carbon-100: #E4E8EC;\n  --carbon-200: #C8CED6;\n  --carbon-300: #A3ABB7;\n  --carbon-400: #79828F;\n  --carbon-500: #565E6B;\n  --carbon-600: #3D4550;\n  --carbon-700: #2A313B;\n  --carbon-800: #1C222A;\n  --carbon-850: #161B22;\n  --carbon-900: #11151B;\n  --carbon-950: #0A0D11;\n\n  /* --- Ignition (primary power accent — red) --- */\n  --power-50:  #FFECED;\n  --power-100: #FFD2D5;\n  --power-200: #FFA5AB;\n  --power-300: #FB6E78;\n  --power-400: #F23B47;\n  --power-500: #E11226;  /* primary */\n  --power-600: #C00C1E;\n  --power-700: #960A18;\n  --power-800: #6F0712;\n\n  /* --- Redline (critical / danger — hot red) --- */\n  --redline-100: #FBD9DD;\n  --redline-300: #F08B96;\n  --redline-500: #E5283C;\n  --redline-600: #C71B2E;\n  --redline-700: #9E1424;\n\n  /* --- Telemetry (info / data — electric cyan-blue) --- */\n  --telemetry-100: #D2EEF6;\n  --telemetry-300: #74CDE3;\n  --telemetry-500: #1FA8CC;\n  --telemetry-600: #1487A8;\n  --telemetry-700: #0F6883;\n\n  /* --- Dyno (success / gain — green) --- */\n  --dyno-100: #D6F2E2;\n  --dyno-300: #74D3A1;\n  --dyno-500: #21B26C;\n  --dyno-600: #169059;\n  --dyno-700: #107046;\n\n  /* --- Amber (warning) --- */\n  --amber-100: #FCEFCB;\n  --amber-300: #F4CF6A;\n  --amber-500: #ECAE13;\n  --amber-600: #C68E07;\n  --amber-700: #9A6E05;\n\n  /* --- Pure --- */\n  --white: #FFFFFF;\n  --black: #000000;\n}\n\n/* ============================================================\n   SEMANTIC ALIASES — LIGHT (default, \"hell\")\n   ============================================================ */\n:root,\n[data-theme=\"light\"] {\n  color-scheme: light;\n\n  --bg:             var(--carbon-25);\n  --bg-grid:        var(--carbon-100);   /* hairline grid lines */\n  --surface:        var(--white);\n  --surface-2:      var(--carbon-50);\n  --surface-sunken: var(--carbon-100);\n  --surface-inverse: var(--carbon-900);\n\n  --border:         var(--carbon-100);\n  --border-strong:  var(--carbon-200);\n  --border-accent:  var(--power-500);\n\n  --text:           var(--carbon-900);\n  --text-muted:     var(--carbon-500);\n  --text-subtle:    var(--carbon-400);\n  --text-inverse:   var(--carbon-25);\n  --text-on-accent: var(--white);\n\n  --accent:         var(--power-500);\n  --accent-hover:   var(--power-600);\n  --accent-press:   var(--power-700);\n  --accent-soft:    var(--power-50);\n  --accent-soft-border: var(--power-200);\n  --accent-text:    var(--power-700);\n\n  --info:    var(--telemetry-600);\n  --info-soft: var(--telemetry-100);\n  --success: var(--dyno-600);\n  --success-soft: var(--dyno-100);\n  --warning: var(--amber-600);\n  --warning-soft: var(--amber-100);\n  --danger:  var(--redline-600);\n  --danger-soft: var(--redline-100);\n\n  --focus-ring: color-mix(in oklch, var(--power-500) 55%, transparent);\n}\n\n/* ============================================================\n   SEMANTIC ALIASES — DARK (\"dunkel\")\n   ============================================================ */\n[data-theme=\"dark\"] {\n  color-scheme: dark;\n\n  --bg:             var(--carbon-950);\n  --bg-grid:        var(--carbon-800);\n  --surface:        var(--carbon-900);\n  --surface-2:      var(--carbon-850);\n  --surface-sunken: var(--carbon-950);\n  --surface-inverse: var(--carbon-50);\n\n  --border:         var(--carbon-800);\n  --border-strong:  var(--carbon-700);\n  --border-accent:  var(--power-500);\n\n  --text:           var(--carbon-50);\n  --text-muted:     var(--carbon-400);\n  --text-subtle:    var(--carbon-500);\n  --text-inverse:   var(--carbon-900);\n  --text-on-accent: var(--white);\n\n  --accent:         var(--power-500);\n  --accent-hover:   var(--power-400);\n  --accent-press:   var(--power-300);\n  --accent-soft:    color-mix(in oklch, var(--power-500) 16%, var(--carbon-900));\n  --accent-soft-border: color-mix(in oklch, var(--power-500) 38%, var(--carbon-800));\n  --accent-text:    var(--power-400);\n\n  --info:    var(--telemetry-300);\n  --info-soft: color-mix(in oklch, var(--telemetry-500) 18%, var(--carbon-900));\n  --success: var(--dyno-300);\n  --success-soft: color-mix(in oklch, var(--dyno-500) 18%, var(--carbon-900));\n  --warning: var(--amber-300);\n  --warning-soft: color-mix(in oklch, var(--amber-500) 18%, var(--carbon-900));\n  --danger:  var(--redline-300);\n  --danger-soft: color-mix(in oklch, var(--redline-500) 20%, var(--carbon-900));\n\n  --focus-ring: color-mix(in oklch, var(--power-400) 65%, transparent);\n}\n\n/* ============================================================\n   TYPOGRAPHY — Chiptuningfile Design System\n   ============================================================ */\n:root {\n  /* --- Families --- */\n  --font-display: 'Saira Condensed', 'Arial Narrow', sans-serif;\n  --font-sans:    'Archivo', system-ui, -apple-system, sans-serif;\n  --font-mono:    'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;\n\n  /* --- Weights --- */\n  --fw-regular:  400; /* @kind other */\n  --fw-medium:   500; /* @kind other */\n  --fw-semibold: 600; /* @kind other */\n  --fw-bold:     700; /* @kind other */\n  --fw-black:    800; /* @kind other */\n\n  /* --- Fluid type scale (clamped) --- */\n  --text-2xs: 0.6875rem;  /* 11px — micro labels, table meta */\n  --text-xs:  0.75rem;    /* 12px */\n  --text-sm:  0.875rem;   /* 14px */\n  --text-md:  1rem;       /* 16px — base body */\n  --text-lg:  1.125rem;   /* 18px */\n  --text-xl:  1.375rem;   /* 22px */\n  --text-2xl: 1.75rem;    /* 28px */\n  --text-3xl: clamp(2rem, 5vw, 3rem);        /* 32→48 */\n  --text-4xl: clamp(2.75rem, 7vw, 4.5rem);   /* 44→72 */\n  --text-5xl: clamp(3.5rem, 9vw, 6.5rem);    /* 56→104 — hero */\n\n  /* --- Line heights --- */\n  --lh-tight:   1.02; /* @kind other */\n  --lh-snug:    1.15; /* @kind other */\n  --lh-normal:  1.45; /* @kind other */\n  --lh-relaxed: 1.65; /* @kind other */\n\n  /* --- Tracking --- */\n  --ls-tight:   -0.02em; /* @kind other */\n  --ls-normal:  0; /* @kind other */\n  --ls-wide:    0.04em; /* @kind other */\n  --ls-label:   0.12em;   /* @kind other */\n  --ls-mono:    0.02em; /* @kind other */\n}\n\n/* --- Optional helper utility classes (foundation specimens / cards) --- */\n.ds-display { font-family: var(--font-display); font-weight: var(--fw-bold); line-height: var(--lh-tight); letter-spacing: var(--ls-tight); text-transform: uppercase; }\n.ds-eyebrow { font-family: var(--font-mono); font-size: var(--text-xs); font-weight: var(--fw-medium); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--accent-text); }\n.ds-body    { font-family: var(--font-sans); font-size: var(--text-md); line-height: var(--lh-relaxed); color: var(--text); }\n.ds-mono    { font-family: var(--font-mono); letter-spacing: var(--ls-mono); }\n\n/* ============================================================\n   SPACING & LAYOUT — Chiptuningfile Design System\n   8px base grid with a few half-steps for dense data UIs.\n   ============================================================ */\n:root {\n  --space-0:   0;\n  --space-px:  1px;\n  --space-1:   0.25rem;  /* 4 */\n  --space-2:   0.5rem;   /* 8 */\n  --space-3:   0.75rem;  /* 12 */\n  --space-4:   1rem;     /* 16 */\n  --space-5:   1.5rem;   /* 24 */\n  --space-6:   2rem;     /* 32 */\n  --space-7:   2.5rem;   /* 40 */\n  --space-8:   3rem;     /* 48 */\n  --space-9:   4rem;     /* 64 */\n  --space-10:  5rem;     /* 80 */\n  --space-11:  6rem;     /* 96 */\n  --space-12:  8rem;     /* 128 */\n\n  /* --- Layout --- */\n  --container:      1240px;\n  --container-wide: 1440px;\n  --container-prose: 68ch;\n  --gutter:         clamp(1rem, 4vw, 2.5rem); /* @kind spacing */\n  --header-h:       72px;\n}\n\n/* ============================================================\n   EFFECTS — radii, borders, shadows, motion\n   Sharp, engineered feel: small radii, crisp hairlines,\n   low-spread shadows. Accent \"glow\" reserved for emphasis.\n   ============================================================ */\n:root {\n  /* --- Radii (deliberately tight / mechanical) --- */\n  --radius-0:   0;\n  --radius-xs:  2px;\n  --radius-sm:  4px;\n  --radius-md:  6px;\n  --radius-lg:  10px;\n  --radius-xl:  14px;\n  --radius-pill: 999px;\n\n  /* --- Border widths --- */\n  --bw-hair:   1px;\n  --bw-thick:  2px;\n\n  /* --- Shadows (light theme tuned) --- */\n  --shadow-xs:  0 1px 2px rgba(10, 13, 17, 0.06);\n  --shadow-sm:  0 1px 2px rgba(10, 13, 17, 0.06), 0 2px 6px rgba(10, 13, 17, 0.06);\n  --shadow-md:  0 4px 10px rgba(10, 13, 17, 0.08), 0 2px 4px rgba(10, 13, 17, 0.05);\n  --shadow-lg:  0 12px 28px rgba(10, 13, 17, 0.12), 0 4px 8px rgba(10, 13, 17, 0.06);\n  --shadow-xl:  0 24px 56px rgba(10, 13, 17, 0.18);\n\n  /* --- Signature accent glow (use sparingly: primary CTA, live data) --- */\n  --glow-power: 0 0 0 1px var(--power-500), 0 6px 22px -6px color-mix(in oklch, var(--power-500) 55%, transparent);\n\n  /* --- Motion --- */\n  --ease-out:   cubic-bezier(0.16, 1, 0.3, 1);     /* @kind other */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */\n  --ease-snap:  cubic-bezier(0.34, 1.4, 0.5, 1);   /* @kind other */\n  --dur-fast:   120ms; /* @kind other */\n  --dur-base:   200ms; /* @kind other */\n  --dur-slow:   360ms; /* @kind other */\n}\n\n/* Shadows are heavier / darker in dark theme to read against carbon */\n[data-theme=\"dark\"] {\n  --shadow-xs:  0 1px 2px rgba(0, 0, 0, 0.4);\n  --shadow-sm:  0 1px 2px rgba(0, 0, 0, 0.4), 0 2px 6px rgba(0, 0, 0, 0.4);\n  --shadow-md:  0 4px 12px rgba(0, 0, 0, 0.5);\n  --shadow-lg:  0 14px 32px rgba(0, 0, 0, 0.55);\n  --shadow-xl:  0 26px 60px rgba(0, 0, 0, 0.65);\n}\n\n/* ============================================================\n   BASE — element defaults, applied on top of tokens.\n   ============================================================ */\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-size: var(--text-md);\n  line-height: var(--lh-relaxed);\n  color: var(--text);\n  background: var(--bg);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4, h5 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--ls-tight);\n  text-transform: uppercase;\n  margin: 0 0 0.4em;\n  color: var(--text);\n}\nh1 { font-size: var(--text-4xl); }\nh2 { font-size: var(--text-3xl); }\nh3 { font-size: var(--text-2xl); }\nh4 { font-size: var(--text-xl); }\n\np { margin: 0 0 1em; text-wrap: pretty; }\n\na { color: var(--accent-text); text-decoration: none; }\na:hover { text-decoration: underline; }\n\ncode, kbd, samp { font-family: var(--font-mono); font-size: 0.92em; }\n\n::selection { background: var(--accent); color: var(--text-on-accent); }\n\n:focus-visible {\n  outline: var(--bw-thick) solid var(--focus-ring);\n  outline-offset: 2px;\n}\n\nhr { border: 0; border-top: var(--bw-hair) solid var(--border); margin: var(--space-5) 0; }\n\n/* Eyebrow / kicker label used across the brand */\n.eyebrow {\n  font-family: var(--font-mono);\n  font-size: var(--text-xs);\n  font-weight: var(--fw-medium);\n  letter-spacing: var(--ls-label);\n  text-transform: uppercase;\n  color: var(--accent-text);\n}\n\n/* Engineered hairline grid background — signature surface texture */\n.grid-surface {\n  background-color: var(--bg);\n  background-image:\n    linear-gradient(var(--bg-grid) var(--bw-hair), transparent var(--bw-hair)),\n    linear-gradient(90deg, var(--bg-grid) var(--bw-hair), transparent var(--bw-hair));\n  background-size: 32px 32px;\n}\n\n<\u002Fstyle>\n<style>/* Marketing UI kit — layout styles (composes DS tokens) */\n.mk-root{background:var(--bg);color:var(--text);min-height:100vh;}\n.mk-wrap{max-width:var(--container);margin:0 auto;padding-inline:var(--gutter);}\n.mk-accent{color:var(--accent);}\n.mk-mono{font-family:var(--font-mono);font-size:var(--text-2xs);letter-spacing:.14em;text-transform:uppercase;color:var(--text-subtle);}\n\n/* media placeholder */\n.mk-media{border:var(--bw-hair) solid var(--border);border-radius:var(--radius-lg);\n  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;\n  color:var(--text-subtle);min-height:220px;overflow:hidden;}\n.mk-media__ico svg,.mk-media__ico i{width:40px;height:40px;color:var(--accent);opacity:.85;}\n.mk-media__lbl{font-family:var(--font-mono);font-size:var(--text-2xs);letter-spacing:.1em;text-transform:uppercase;}\n\n/* header */\n.mk-header{position:sticky;top:0;z-index:50;background:color-mix(in oklch,var(--bg) 88%,transparent);\n  backdrop-filter:blur(10px);border-bottom:var(--bw-hair) solid var(--border);}\n.mk-header__in{height:var(--header-h);display:flex;align-items:center;gap:var(--space-6);}\n.mk-nav{display:flex;gap:var(--space-5);margin-left:var(--space-4);flex:1;}\n.mk-nav a{font-size:var(--text-sm);font-weight:var(--fw-semibold);color:var(--text-muted);text-decoration:none;}\n.mk-nav a:hover{color:var(--text);}\n.mk-header__act{display:flex;align-items:center;gap:var(--space-2);}\n.mk-icobtn{width:40px;height:40px;border:var(--bw-hair) solid transparent;background:transparent;color:var(--text);\n  border-radius:var(--radius-md);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}\n.mk-icobtn:hover{background:var(--surface-2);}\n.mk-icobtn svg,.mk-icobtn i{width:20px;height:20px;}\n\n/* hero */\n.mk-hero{border-bottom:var(--bw-hair) solid var(--border);}\n.mk-hero__in{display:grid;grid-template-columns:1.05fr .95fr;gap:var(--space-8);align-items:center;\n  padding-block:var(--space-9);}\n.mk-hero__h1{font-size:var(--text-5xl);margin:var(--space-3) 0 var(--space-4);}\n.mk-hero__sub{font-size:var(--text-lg);color:var(--text-muted);max-width:46ch;margin-bottom:var(--space-5);}\n.mk-finder{background:var(--surface);border:var(--bw-hair) solid var(--border);border-radius:var(--radius-xl);\n  padding:var(--space-5);box-shadow:var(--shadow-md);}\n.mk-finder__t{display:flex;align-items:center;gap:.5em;font-family:var(--font-mono);font-size:var(--text-xs);\n  letter-spacing:.1em;text-transform:uppercase;color:var(--accent-text);margin-bottom:var(--space-4);}\n.mk-finder__t svg,.mk-finder__t i{width:15px;height:15px;}\n.mk-finder__row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:var(--space-3);align-items:end;}\n\n/* stats strip */\n.mk-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-4);padding-block:var(--space-7);}\n\n/* stages */\n.mk-stages{padding-block:var(--space-8);}\n.mk-sec-head{margin-bottom:var(--space-6);}\n.mk-sec-head h2{font-size:var(--text-3xl);margin-top:var(--space-2);}\n.mk-on-dark{color:#fff;}\n.mk-stage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-5);}\n.mk-stage-desc{color:var(--text-muted);font-size:var(--text-sm);margin:0 0 var(--space-4);}\n.mk-stage-figs{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);}\n.mk-price{font-family:var(--font-mono);font-weight:var(--fw-semibold);font-size:var(--text-md);color:var(--text);}\n\n/* trust (dark band) */\n.mk-trust{background:var(--carbon-950);border-block:var(--bw-hair) solid var(--carbon-800);\n  padding-block:var(--space-9);margin-top:var(--space-9);}\n.mk-trust [data-theme]{color:inherit;}\n.mk-trust .eyebrow{color:var(--power-400);}\n.mk-trust-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-5);}\n.mk-trust-item h4{color:#fff;font-size:var(--text-lg);margin:var(--space-3) 0 var(--space-2);}\n.mk-trust-item p{color:var(--carbon-400);font-size:var(--text-sm);margin:0;}\n.mk-trust-ico{display:inline-flex;width:48px;height:48px;border-radius:var(--radius-md);\n  align-items:center;justify-content:center;background:color-mix(in oklch,var(--power-500) 16%,var(--carbon-900));\n  border:var(--bw-hair) solid color-mix(in oklch,var(--power-500) 35%,transparent);color:var(--power-400);}\n.mk-trust-ico svg,.mk-trust-ico i{width:24px;height:24px;}\n\n/* CTA */\n.mk-cta{padding-block:var(--space-9);}\n.mk-cta__box{display:flex;align-items:center;justify-content:space-between;gap:var(--space-6);flex-wrap:wrap;\n  background:var(--surface);border:var(--bw-hair) solid var(--border);border-top:var(--bw-thick) solid var(--accent);\n  border-radius:var(--radius-xl);padding:var(--space-7);box-shadow:var(--shadow-sm);}\n.mk-cta__box h2{font-size:var(--text-3xl);margin:var(--space-2) 0;}\n.mk-cta__box p{color:var(--text-muted);margin:0;}\n.mk-cta__act{display:flex;gap:var(--space-3);flex-wrap:wrap;}\n\n/* footer */\n.mk-footer{background:var(--surface);border-top:var(--bw-hair) solid var(--border);margin-top:var(--space-6);}\n.mk-footer__in{display:grid;grid-template-columns:1.2fr 2fr;gap:var(--space-7);padding-block:var(--space-8);}\n.mk-footer__brand p{color:var(--text-muted);font-size:var(--text-sm);max-width:32ch;margin-top:var(--space-4);}\n.mk-footer__cols{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-5);}\n.mk-footer__cols h5{font-family:var(--font-mono);font-size:var(--text-2xs);letter-spacing:.1em;text-transform:uppercase;\n  color:var(--text-subtle);margin:0 0 var(--space-3);}\n.mk-footer__cols a{display:block;color:var(--text-muted);font-size:var(--text-sm);text-decoration:none;padding:4px 0;}\n.mk-footer__cols a:hover{color:var(--accent-text);}\n.mk-footer__bar{display:flex;justify-content:space-between;align-items:center;\n  border-top:var(--bw-hair) solid var(--border);padding-block:var(--space-4);font-size:var(--text-sm);color:var(--text-muted);}\n\n@media (max-width:900px){\n  .mk-hero__in,.mk-footer__in{grid-template-columns:1fr;}\n  .mk-stage-grid,.mk-trust-grid,.mk-stats{grid-template-columns:1fr 1fr;}\n  .mk-finder__row{grid-template-columns:1fr 1fr;}\n  .mk-nav{display:none;}\n}\n<\u002Fstyle>\n<!-- Logo SVGs are referenced as string paths inside the JS bundle; lift them so the bundler inlines them -->\n\n\n\n<\u002Fhead>\n<body>\n  <div id=\"root\"><\u002Fdiv>\n  <script src=\"983dbac2-8535-4b45-8886-e3c86ee21b36\" integrity=\"sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L\" crossorigin=\"anonymous\"><\u002Fscript>\n  <script src=\"f22ad966-9165-4b82-8800-b407bb1a9b5a\" integrity=\"sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm\" crossorigin=\"anonymous\"><\u002Fscript>\n  <script src=\"ae2e1ed1-0d2c-4ecb-8f27-03c2ab37d416\"><\u002Fscript>\n  <script src=\"eca435e2-ac91-4881-9945-a5ab357504bd\"><\u002Fscript>\n  <script>\n    const { MarketingSite } = window.ChiptuningfileDesignSystem_3beb42;\n    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(MarketingSite, { initialTheme: 'light' }));\n    if (window.lucide) window.lucide.createIcons();\n\n    // Swap logo <img src> to the inlined blob URLs (paths are built inside the bundle, invisible to the bundler).\n    function fixLogos() {\n      if (!window.__resources) return;\n      document.querySelectorAll('img').forEach((img) => {\n        const s = img.getAttribute('src') || '';\n        if (s.indexOf('logo-mark-solid.svg') !== -1 && window.__resources.logoMarkSolid) img.src = window.__resources.logoMarkSolid;\n        else if (s.indexOf('logo-mark.svg') !== -1 && window.__resources.logoMark) img.src = window.__resources.logoMark;\n      });\n    }\n    fixLogos();\n    const mo = new MutationObserver(fixLogos);\n    mo.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['src'] });\n    setTimeout(() => { if (window.lucide) window.lucide.createIcons(); fixLogos(); }, 300);\n  <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"

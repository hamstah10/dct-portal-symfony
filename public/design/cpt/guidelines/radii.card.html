<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="Tight & mechanical — 4–14px, 0 valid for tables" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 24px; background: var(--surface); font-family: var(--font-mono); }
  .row { display:flex; gap:16px; }
  .item { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .box { width:64px; height:48px; background:var(--surface-2); border:1px solid var(--border-strong); border-top:2px solid var(--accent); }
  .lab { font-size:10px; color:var(--text-muted); text-align:center; }
  .lab b { display:block; color:var(--text); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-0)"></div><div class="lab"><b>0</b>table</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="lab"><b>xs</b>2px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lab"><b>sm</b>4px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="lab"><b>md</b>6px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lab"><b>lg</b>10px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="lab"><b>xl</b>14px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-pill);width:80px"></div><div class="lab"><b>pill</b>chips</div></div>
  </div>
</body>
</html>

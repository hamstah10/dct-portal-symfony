<!-- @dsCard group="Type" viewport="700x180" name="Display — Orbitron" subtitle="Geometric futuristic headlines, set UPPERCASE" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--surface); }
  .ey { font-family:var(--font-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent-text); margin-bottom:6px; }
  .big { font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:-.01em; line-height:1; color:var(--text); font-size:42px; margin:0; }
  .sub { font-family:var(--font-mono); font-size:11px; color:var(--text-muted); margin-top:12px; display:flex; gap:18px; }
</style>
</head>
<body>
  <div class="ey">Stage 1 · ECU Remap</div>
  <h1 class="big">Mehr Leistung</h1>
  <div class="sub"><span>Orbitron&nbsp;700</span><span>tracking&nbsp;-0.01em</span><span>UPPERCASE</span></div>
</body>
</html>

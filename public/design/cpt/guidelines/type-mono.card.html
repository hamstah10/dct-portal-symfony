<!-- @dsCard group="Type" viewport="700x180" name="Mono — IBM Plex Mono" subtitle="Specs, ECU readouts, eyebrows, measured figures" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 24px; background: var(--carbon-950); font-family: var(--font-mono); color: var(--carbon-100); }
  .grid { display:grid; grid-template-columns: repeat(3,1fr); gap:1px; background:var(--carbon-800); border:1px solid var(--carbon-800); border-radius:var(--radius-md); overflow:hidden; }
  .c { background:var(--carbon-900); padding:12px 14px; }
  .k { font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--carbon-400); }
  .v { font-size:24px; font-weight:600; margin-top:4px; }
  .v .u { font-size:13px; color:var(--carbon-400); }
  .pos { color:var(--power-400); }
</style>
</head>
<body>
  <div class="grid">
    <div class="c"><div class="k">Leistung</div><div class="v pos">+38<span class="u"> PS</span></div></div>
    <div class="c"><div class="k">Drehmoment</div><div class="v pos">+72<span class="u"> Nm</span></div></div>
    <div class="c"><div class="k">Hubraum</div><div class="v">1.598<span class="u"> cm³</span></div></div>
  </div>
</body>
</html>

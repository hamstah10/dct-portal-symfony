<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation & glow" subtitle="Low neutral shadows; ignition glow for emphasis" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-2); font-family: var(--font-mono); }
  .row { display:flex; gap:22px; align-items:center; }
  .item { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .box { width:84px; height:56px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); }
  .lab { font-size:10px; color:var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="lab">xs</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="lab">sm</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="lab">md</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="lab">lg</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xl)"></div><div class="lab">xl</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--glow-power);border-color:transparent"></div><div class="lab" style="color:var(--accent-text)">glow-power</div></div>
  </div>
</body>
</html>

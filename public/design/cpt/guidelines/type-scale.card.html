<!-- @dsCard group="Type" viewport="700x230" name="Type scale" subtitle="Fluid scale from hero to micro-label" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px 24px; background: var(--surface); color: var(--text); }
  .r { display:flex; align-items:baseline; gap:16px; border-bottom:1px solid var(--border); padding:7px 0; }
  .r:last-child{ border-bottom:0; }
  .tok { font-family:var(--font-mono); font-size:10px; color:var(--text-subtle); width:84px; flex:none; }
  .ex { font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:-.02em; line-height:1; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>
  <div class="r"><span class="tok">5xl · hero</span><span class="ex" style="font-size:46px">Tuning</span></div>
  <div class="r"><span class="tok">4xl · h1</span><span class="ex" style="font-size:34px">Mehr Leistung</span></div>
  <div class="r"><span class="tok">3xl · h2</span><span class="ex" style="font-size:26px">Fahrzeug wählen</span></div>
  <div class="r"><span class="tok">2xl · h3</span><span class="ex" style="font-size:20px">Stage 1 · 2 · 3</span></div>
  <div class="r"><span class="tok">md · body</span><span class="ex" style="font-family:var(--font-sans);font-weight:500;text-transform:none;letter-spacing:0;font-size:16px">Optimierte Kennfelder, auf dem Prüfstand abgestimmt.</span></div>
</body>
</html>

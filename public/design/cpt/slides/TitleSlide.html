<!-- @dsCard group="Slides" viewport="1280x720" name="Title slide" subtitle="Dark hero opener with grid texture" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;}
  .slide{width:1280px;height:720px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;
    padding:72px 88px;box-sizing:border-box;font-family:var(--font-sans);}
  .slide__top{display:flex;align-items:center;gap:14px;}
  .slide__top img{width:40px;height:40px;}
  .slide__wm{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:22px;color:#fff;letter-spacing:-.01em;}
  .slide__wm em{font-style:normal;color:var(--power-500);}
  .ey{font-family:var(--font-mono);font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--power-400);margin-bottom:22px;}
  h1{font-size:108px;line-height:.92;color:#fff;margin:0;max-width:16ch;}
  h1 .accent{color:var(--power-500);}
  .sub{font-size:22px;color:var(--carbon-300);max-width:52ch;margin-top:26px;}
  .foot{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--carbon-500);}
</style>
</head>
<body>
  <div class="slide grid-surface" data-theme="dark">
    <div class="slide__top"><img src="../assets/logo-mark-solid.svg" alt=""><span class="slide__wm">Chip<em>tuning</em>file</span></div>
    <div>
      <div class="ey">Stage 1 · ECU Remap</div>
      <h1>Mehr Leistung.<br><span class="accent">Aus deiner Datei.</span></h1>
      <p class="sub">Optimierte Kennfelder für über 8.000 Fahrzeuge — auf dem Prüfstand abgestimmt.</p>
    </div>
    <div class="foot"><span>chiptuningfile.de</span><span>Seit 2010</span></div>
  </div>
</body>
</html>

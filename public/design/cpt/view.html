<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ansicht — Chiptuningfile Design System</title>
<link rel="stylesheet" href="styles.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: var(--font-sans); overflow: hidden; }

  .bar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 14px;
    height: 56px; padding: 0 16px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-sm); z-index: 10;
  }
  .back {
    display: inline-flex; align-items: center; gap: 9px;
    font-family: var(--font-mono); font-size: var(--text-xs);
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--text);
    border: 1px solid var(--border-strong); background: var(--surface);
    padding: 9px 14px 9px 11px; border-radius: var(--radius-sm);
    text-decoration: none; transition: border-color var(--dur-fast), background var(--dur-fast), color var(--dur-fast);
    white-space: nowrap;
  }
  .back:hover { border-color: var(--accent); color: var(--accent-text); background: var(--accent-soft); }
  .back .arrow { font-size: 15px; line-height: 1; transition: transform var(--dur-base) var(--ease-out); }
  .back:hover .arrow { transform: translateX(-3px); }

  .sep { width: 1px; height: 26px; background: var(--border); flex: 0 0 auto; }

  .mark { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .mark svg { width: 26px; height: 26px; border-radius: var(--radius-xs); flex: 0 0 auto; display: block; }
  .titles { min-width: 0; }
  .titles .t {
    font-family: var(--font-display); font-weight: var(--fw-semibold); text-transform: uppercase;
    letter-spacing: 0.01em; font-size: var(--text-md); line-height: 1.1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .titles .s {
    font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--text-muted);
    letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
  }

  .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .raw {
    display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
    font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-muted); text-decoration: none; padding: 9px 12px; border-radius: var(--radius-sm);
    transition: color var(--dur-fast), background var(--dur-fast);
  }
  .raw:hover { color: var(--text); background: var(--surface-2); }
  .esc { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--text-subtle); letter-spacing: 0.06em; white-space: nowrap; }
  .esc kbd {
    font-family: var(--font-mono); border: 1px solid var(--border-strong); border-bottom-width: 2px;
    border-radius: var(--radius-xs); padding: 1px 6px; color: var(--text-muted); background: var(--surface-2); font-size: 10px;
  }

  .stage { flex: 1 1 auto; position: relative; background: var(--bg); }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--surface); }

  @media (max-width: 620px) {
    .titles .s, .esc { display: none; }
    .back span.lbl { display: none; }
    .back { padding: 9px 12px; }
  }
</style>
</head>
<body>
  <div class="bar">
    <a class="back" href="Design System.html" id="back">
      <span class="arrow">←</span><span class="lbl">Design System</span>
    </a>
    <div class="sep"></div>
    <a class="mark" href="Design System.html" title="Zur Übersicht" style="text-decoration:none;color:inherit">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="48" height="48" rx="7" fill="#0A0D11"></rect>
        <path d="M14 13 L24 24 L14 35" stroke="#E11226" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" fill="none"></path>
        <path d="M24 13 L34 24 L24 35" stroke="#E11226" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" fill="none" opacity="0.45"></path>
      </svg>
      <div class="titles">
        <div class="t" id="title">Ansicht</div>
        <div class="s" id="sub"></div>
      </div>
    </a>
    <div class="right">
      <span class="esc"><kbd>Esc</kbd> zurück</span>
      <a class="raw" id="raw" href="#" target="_blank" rel="noopener">Original ↗</a>
    </div>
  </div>
  <div class="stage">
    <iframe id="frame" title="Vorschau"></iframe>
  </div>

<script>
  const qs = new URLSearchParams(location.search);
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  const src = qs.get('src') || hash.get('src') || '';
  const title = hash.get('t') || 'Ansicht';
  const sub = hash.get('s') || '';

  // theme the bar to match the home page's saved preference
  const saved = localStorage.getItem('ds-home-theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);

  document.getElementById('title').textContent = title;
  document.getElementById('sub').textContent = sub || src;
  document.title = title + ' — Chiptuningfile Design System';

  // only allow same-origin relative paths (our own files)
  const safe = src && !/^(?:[a-z]+:)?\/\//i.test(src) ? src : 'Design System.html';
  document.getElementById('frame').src = safe;
  document.getElementById('raw').href = safe;

  // Esc returns to the overview
  addEventListener('keydown', (e) => {
    if (e.key === 'Escape') location.href = 'Design System.html';
  });
</script>
</body>
</html>

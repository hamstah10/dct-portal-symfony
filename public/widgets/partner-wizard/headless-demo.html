<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Partner Wizard – Headless Demo</title>
<style>
  /* Komplett eigenes Design – nutzt NICHT style.css des Widgets. */
  :root { --accent:#2563eb; --bg:#f6f7f9; --card:#fff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0; --radius:14px; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width:820px; margin:0 auto; padding:40px 16px 80px; }
  .note { font-size:12px; color:var(--muted); margin-bottom:24px; }
  .note code { background:#e2e8f0; padding:1px 5px; border-radius:4px; }
  h1 { font-size:28px; margin:0 0 6px; }
  .intro { color:var(--muted); margin:0 0 28px; }
  .progress { display:flex; gap:6px; margin-bottom:24px; }
  .progress span { flex:1; height:4px; border-radius:2px; background:var(--line); }
  .progress span.on { background:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:28px; }
  .stepLabel { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 18px; }
  .q { margin-bottom:28px; }
  .q h3 { font-size:17px; margin:0 0 4px; }
  .q .help { color:var(--muted); font-size:13px; margin:0 0 10px; }
  .opts { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px; margin-top:10px; }
  .opt { display:flex; flex-direction:column; align-items:flex-start; gap:6px; text-align:left; padding:14px; border:1.5px solid var(--line); border-radius:10px; background:#fff; cursor:pointer; font:inherit; color:inherit; }
  .opt:hover { border-color:#94a3b8; }
  .opt.sel { border-color:var(--accent); background:#eff6ff; }
  .opt img { width:36px; height:36px; object-fit:contain; }
  .opt b { font-size:14px; }
  .opt small { color:var(--muted); font-size:12px; }
  label.field { display:block; margin-bottom:14px; font-weight:600; font-size:14px; }
  label.field input, label.field textarea { display:block; width:100%; margin-top:6px; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px; font:inherit; font-weight:400; }
  label.check { display:flex; gap:10px; align-items:flex-start; font-size:13px; color:var(--muted); margin:6px 0 14px; }
  .hp { position:absolute; left:-9999px; }
  .nav { display:flex; justify-content:space-between; margin-top:8px; }
  button.btn { padding:11px 22px; border-radius:8px; border:0; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button.btn.ghost { background:transparent; color:var(--text); border:1.5px solid var(--line); }
  button.btn:disabled { opacity:.5; cursor:default; }
  .pkg { padding:18px; border-radius:10px; background:#eff6ff; margin-bottom:18px; }
  .pkg h3 { margin:0 0 6px; }
  .pkg ul { margin:8px 0 0; padding-left:18px; }
  .tools { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; margin:12px 0; }
  .tool { border:1px solid var(--line); border-radius:10px; padding:14px; }
  .tool img { max-width:100%; height:70px; object-fit:contain; display:block; margin-bottom:8px; }
  .price s { color:var(--muted); margin-right:6px; }
  .price b { color:var(--accent); }
  .muted { color:var(--muted); font-size:13px; }
  .error { color:#b91c1c; margin-top:10px; }
  .ok { text-align:center; padding:30px 0; }
  pre { background:#0f172a; color:#e2e8f0; padding:14px; border-radius:8px; font-size:12px; overflow:auto; max-height:260px; }
  details { margin-top:24px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="note">Headless-Demo: Diese Seite nutzt nur die REST-API (<code>/api/tfd-partner-wizard/*</code>) mit eigenem HTML/CSS. Client per <code>?client=…</code>. Doku: <code>docs/partner-wizard-api.md</code></p>
  <h1 id="headline">Lädt …</h1>
  <p class="intro" id="intro"></p>
  <div class="progress" id="progress"></div>
  <div class="card" id="card"></div>
  <details><summary class="muted">Letzter API-Request / -Response</summary><pre id="debug">–</pre></details>
</div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var API = params.get('api') || location.origin;
  var CLIENT = params.get('client') || 'no1';

  var config = null, steps = [], stepIndex = 0, answers = {}, recommendation = null;
  var card = document.getElementById('card');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
  function debug(label, data) { document.getElementById('debug').textContent = label + '\n' + JSON.stringify(data, null, 2); }

  function api(path, body) {
    var opts = body ? { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(body) } : { headers: { Accept: 'application/json' } };
    return fetch(API + path, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        debug((body ? 'POST ' : 'GET ') + path + ' → ' + r.status + (body ? '\n\nRequest:\n' + JSON.stringify(body, null, 2) + '\n\nResponse:' : ''), data);
        if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
        return data;
      });
    });
  }

  // Wert einer Option abhängig vom questionType (vehicleType → numerische ID).
  function optValue(q, o) { return q.questionType === 'vehicleType' ? o.id : o.value; }
  function optTitle(o) { return o.title || o.name || o.value; }

  function isVisible(q) {
    if (!q.dependsOnAnswerKey) return true;
    var a = answers[q.dependsOnAnswerKey];
    return Array.isArray(a) ? a.indexOf(q.dependsOnValue) !== -1 : String(a) === String(q.dependsOnValue);
  }

  // answerKeys aus dem Fragebogen auf die festen API-Felder abbilden.
  function buildPayload() {
    var vehicles = (answers.vehicles || []).map(Number);
    return {
      clientId: CLIENT,
      goal: answers.goal || '',
      experience: answers.experience || '',
      vehicleCategories: vehicles,
      mainVehicleCategory: vehicles[0] || 0,
      currentTool: answers.tool || '',
      services: answers.services || [],
      website: answers.website || '',
      monthlyVehicleCount: Number(answers.monthlyVehicleCount || 0),
      desiredToolLevel: !answers.tool || answers.tool === 'none' ? 'unknown' : 'slave'
    };
  }

  function renderProgress() {
    document.getElementById('progress').innerHTML = steps.map(function (_, i) { return '<span class="' + (i <= stepIndex ? 'on' : '') + '"></span>'; }).join('');
  }

  function render() {
    renderProgress();
    var step = steps[stepIndex];
    var html = '<p class="stepLabel">Schritt ' + (stepIndex + 1) + ' / ' + steps.length + ' · ' + esc(step.label) + '</p>';

    if (step.type === 'recommendation') {
      html += '<div id="rec"><p class="muted">Empfehlung wird berechnet …</p></div>';
    } else {
      step.questions.filter(isVisible).forEach(function (q) {
        if (q.fieldType === 'checkbox') {
          html += '<label class="check"><input type="checkbox" data-key="' + esc(q.answerKey) + '"' + (answers[q.answerKey] ? ' checked' : '') + '> <span>' + esc(q.answerKey === 'privacyAccepted' ? config.privacyNotice : q.title) + (q.required ? ' *' : '') + '</span></label>';
        } else if (q.fieldType) {
          var tag = q.fieldType === 'textarea' ? 'textarea' : 'input';
          var val = esc(answers[q.answerKey] || '');
          html += '<label class="field">' + esc(q.title) + (q.required ? ' *' : '') +
            (tag === 'textarea' ? '<textarea rows="4" data-key="' + esc(q.answerKey) + '">' + val + '</textarea>'
                                : '<input type="' + esc(q.fieldType) + '" data-key="' + esc(q.answerKey) + '" value="' + val + '">') + '</label>';
        } else {
          html += '<div class="q"><h3>' + esc(q.title) + (q.required ? ' *' : '') + '</h3>' + (q.helpText ? '<p class="help">' + esc(q.helpText) + '</p>' : '') + '<div class="opts">';
          q.options.forEach(function (o) {
            var v = optValue(q, o), a = answers[q.answerKey];
            var sel = q.multiSelect ? (a || []).indexOf(v) !== -1 : a === v;
            var img = o.imageUrl || o.icon;
            html += '<button type="button" class="opt' + (sel ? ' sel' : '') + '" data-q="' + esc(q.answerKey) + '" data-v="' + esc(v) + '">' +
              (img ? '<img src="' + esc(img) + '" alt="">' : '') + '<b>' + esc(optTitle(o)) + '</b>' + (o.text ? '<small>' + esc(o.text) + '</small>' : '') + '</button>';
          });
          html += '</div></div>';
        }
      });
      if (step.type === 'contact') html += '<input class="hp" type="text" id="hp" tabindex="-1" autocomplete="off">';
    }

    var last = stepIndex === steps.length - 1;
    html += '<div class="error" id="err"></div><div class="nav">' +
      '<button type="button" class="btn ghost" id="back"' + (stepIndex === 0 ? ' disabled' : '') + '>Zurück</button>' +
      '<button type="button" class="btn" id="next">' + (last ? esc((recommendation && recommendation.nextStep) || 'Anfrage senden') : 'Weiter') + '</button></div>';
    card.innerHTML = html;

    if (step.type === 'recommendation') loadRecommendation();
  }

  function loadRecommendation() {
    api('/api/tfd-partner-wizard/recommend', buildPayload()).then(function (r) {
      recommendation = r;
      var html = '<div class="pkg"><h3>' + esc(r.packageTitle) + '</h3><p>' + esc(r.packageText) + '</p>' +
        (r.packageFeatures && r.packageFeatures.length ? '<ul>' + r.packageFeatures.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>' : '') + '</div>';
      if (r.recommendedTools.length) {
        html += '<h3>Passende Tools</h3><div class="tools">' + r.recommendedTools.map(function (t) {
          var p = t.product, price = '';
          if (p) price = p.specialPrice && p.specialPrice !== p.price ? '<s>' + esc(p.price) + ' €</s><b>' + esc(p.specialPrice) + ' €</b>' : '<b>' + esc(p.price) + ' €</b>';
          return '<div class="tool">' + (t.imageUrl ? '<img src="' + esc(t.imageUrl) + '" alt="">' : '') + '<b>' + esc(t.name) + '</b><p class="muted">' + esc(t.description || '') + '</p>' +
            (p ? '<div class="price">' + esc(p.title) + ': ' + price + '</div>' : '') + '</div>';
        }).join('') + '</div>';
      }
      html += '<p class="muted">' + esc(r.toolDirection) + '</p><p class="muted"><em>' + esc(r.disclaimer) + '</em></p>';
      document.getElementById('rec').innerHTML = html;
    }).catch(function (e) { document.getElementById('rec').innerHTML = '<p class="error">' + esc(e.message) + '</p>'; });
  }

  function validateStep() {
    var missing = steps[stepIndex].questions.filter(isVisible).filter(function (q) {
      var a = answers[q.answerKey];
      return q.required && (a === undefined || a === '' || a === false || (Array.isArray(a) && !a.length));
    });
    return missing.length ? 'Bitte ausfüllen: ' + missing.map(function (q) { return q.title; }).join(', ') : '';
  }

  function submitLead() {
    var contactKeys = ['name', 'company', 'email', 'phone', 'website', 'message'];
    var contact = {};
    contactKeys.forEach(function (k) { if (answers[k]) contact[k] = answers[k]; });
    var body = Object.assign(buildPayload(), {
      contact: contact,
      privacyAccepted: answers.privacyAccepted === true,
      source: 'headless_demo',
      website_confirm: document.getElementById('hp') ? document.getElementById('hp').value : '',
      answers: answers
    });
    var btn = document.getElementById('next');
    btn.disabled = true;
    api('/api/tfd-partner-wizard/leads', body).then(function (r) {
      card.innerHTML = '<div class="ok"><h2>Danke!</h2><p>' + esc(r.message) + '</p><p class="muted">Lead-ID ' + esc(r.id) + ' · ' + esc(r.recommendation && r.recommendation.packageTitle) + '</p></div>';
    }).catch(function (e) { btn.disabled = false; document.getElementById('err').textContent = e.message; });
  }

  card.addEventListener('click', function (e) {
    var opt = e.target.closest('.opt');
    if (opt) {
      var key = opt.dataset.q, q = null;
      steps[stepIndex].questions.forEach(function (x) { if (x.answerKey === key) q = x; });
      var v = q.questionType === 'vehicleType' ? Number(opt.dataset.v) : opt.dataset.v;
      if (q.multiSelect) {
        var arr = (answers[key] || []).slice(), i = arr.indexOf(v);
        i === -1 ? arr.push(v) : arr.splice(i, 1);
        answers[key] = arr;
      } else {
        answers[key] = v;
      }
      render();
      return;
    }
    if (e.target.id === 'back') { stepIndex--; render(); }
    if (e.target.id === 'next') {
      var err = validateStep();
      if (err) { document.getElementById('err').textContent = err; return; }
      if (stepIndex === steps.length - 1) { submitLead(); return; }
      stepIndex++; render();
    }
  });

  card.addEventListener('input', function (e) {
    var key = e.target.dataset.key;
    if (!key) return;
    answers[key] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  });

  api('/api/tfd-partner-wizard/config/' + encodeURIComponent(CLIENT)).then(function (c) {
    config = c;
    steps = c.steps.filter(function (s) { return s.type === 'recommendation' || s.questions.length; });
    document.getElementById('headline').textContent = c.headline;
    document.getElementById('intro').textContent = c.introText;
    render();
  }).catch(function (e) {
    document.getElementById('headline').textContent = 'Fehler';
    card.innerHTML = '<p class="error">' + esc(e.message) + '</p>';
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiptuning Leistungsdiagramm – Blue Performance Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --blue-dark: #0f2d4f;
            --blue: #1f4f8a;
            --blue-light: #3f82d6;
            --blue-soft: #e9f2ff;
            --bg: #f3f6fb;
            --panel: #ffffff;
            --line: #d9e2ef;
            --green: #8fbf1f;
            --green-dark: #5e7e14;
        }

        * {
            box-sizing: border-box;
            border-radius: 0 !important
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: #1d2a3a;
            margin: 0;
        }

        .header {
            background: linear-gradient(90deg, var(--blue-dark), var(--blue));
            color: white;
            padding: 40px 0;
        }

        .header h1 {
            font-weight: 800;
            font-size: 38px;
        }

        .header p {
            opacity: .9;
        }

        .section {
            padding: 40px 0;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 25px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat {
            background: var(--blue-soft);
            border-left: 6px solid var(--blue-light);
            padding: 18px;
        }

        .stat small {
            text-transform: uppercase;
            font-weight: 700;
            color: #56708f;
        }

        .stat strong {
            font-size: 28px;
            display: block;
            margin-top: 5px;
        }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
        }

        .sidebar {
            background: white;
            border: 1px solid var(--line);
            padding: 20px;
        }

        .sidebar h3 {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        label {
            font-weight: 700;
            margin-top: 12px;
        }

        .form-control,
        .form-select {
            border: 1px solid var(--line);
            padding: 10px;
        }

        .btn-main {
            background: var(--blue);
            color: white;
            border: none;
            padding: 12px;
            font-weight: 700;
            margin-top: 10px;
            width: 100%;
        }

        .btn-main:hover {
            background: var(--blue-dark)
        }

        .btn-export {
            background: #b4e000;
            border: none;
            padding: 12px;
            font-weight: 700;
            width: 100%;
            margin-top: 10px;
        }

        .chart-panel {
            background: white;
            border: 1px solid var(--line);
            padding: 20px;
        }

        .chart-title {
            font-weight: 800;
            margin-bottom: 15px;
        }

        canvas {
            background: white;
            border: 1px solid var(--line);
            padding: 10px;
        }

        @media(max-width:1100px) {
            .layout {
                grid-template-columns: 1fr
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr
            }
        }

    </style>
</head>

<body>

    <div class="header">
        <div class="container">
            <h1>Chiptuning Leistungskurve</h1>
            <p>Fahrzeug wählen, Werte ändern und Serie gegen Stage vergleichen.</p>
        </div>
    </div>

    <div class="section">
        <div class="container">

            <div class="stats-grid">

                <div class="stat">
                    <small>Mehrleistung</small>
                    <strong id="statPs">+41 PS</strong>
                </div>

                <div class="stat">
                    <small>Mehr Drehmoment</small>
                    <strong id="statNm">+70 Nm</strong>
                </div>

                <div class="stat">
                    <small>Peak Leistung</small>
                    <strong id="statPeakPs">227 PS</strong>
                </div>

                <div class="stat">
                    <small>Peak Drehmoment</small>
                    <strong id="statPeakNm">378 Nm</strong>
                </div>

            </div>

            <div class="layout">

                <div class="sidebar">

                    <h3>Einstellungen</h3>

                    <label>Fahrzeug</label>
                    <select id="vehicle" class="form-select">
                        <option value="golf">VW Golf 7 GTD 2.0 TDI</option>
                        <option value="audi">Audi A4 2.0 TDI</option>
                        <option value="bmw">BMW 320d</option>
                    </select>

                    <label>Serie PS</label>
                    <input id="stockps" class="form-control" value="184">

                    <label>Serie Nm</label>
                    <input id="stocknm" class="form-control" value="380">

                    <label>Stage PS</label>
                    <input id="stageps" class="form-control" value="225">

                    <label>Stage Nm</label>
                    <input id="stagenm" class="form-control" value="450">

                    <button class="btn-main" onclick="updateChart()">Aktualisieren</button>
                    <button class="btn-export">Diagramm exportieren</button>

                </div>

                <div class="chart-panel">

                    <div class="chart-title">Leistungsdiagramm</div>

                    <canvas id="chart"></canvas>

                </div>

            </div>

        </div>
    </div>

    <script>

const ctx=document.getElementById('chart');

const rpm=[1200,1700,2200,2700,3200,3700,4200,4700,5200,5700,6200,6700];

const chart=new Chart(ctx,{
 type:'line',
 data:{
 labels:rpm,
 datasets:[
 {
 label:'Nm Serie',
 borderColor:'#7aa21d',
 backgroundColor:'rgba(122,162,29,.25)',
 data:[]
 },
 {
 label:'Nm Stage',
 borderColor:'#3f82d6',
 backgroundColor:'rgba(63,130,214,.3)',
 data:[]
 },
 {
 label:'PS Serie',
 borderColor:'#0f2d4f',
 borderDash:[5,5],
 data:[]
 },
 {
 label:'PS Stage',
 borderColor:'#1f4f8a',
 borderDash:[5,5],
 data:[]
 }
 ]
 }
});

function buildCurve(val){
return rpm.map((r,i)=>Math.round(val*(0.3+0.07*i)))
}

function updateChart(){

let sps=parseInt(document.getElementById('stockps').value)
let snm=parseInt(document.getElementById('stocknm').value)
let tps=parseInt(document.getElementById('stageps').value)
let tnm=parseInt(document.getElementById('stagenm').value)

chart.data.datasets[0].data=buildCurve(snm)
chart.data.datasets[1].data=buildCurve(tnm)
chart.data.datasets[2].data=buildCurve(sps)
chart.data.datasets[3].data=buildCurve(tps)

chart.update()

let diffps=tps-sps
let diffnm=tnm-snm

document.getElementById('statPs').innerText="+"+diffps+" PS"
document.getElementById('statNm').innerText="+"+diffnm+" Nm"
document.getElementById('statPeakPs').innerText=tps+" PS"
document.getElementById('statPeakNm').innerText=tnm+" Nm"

}

updateChart()

    </script>

</body>

</html>

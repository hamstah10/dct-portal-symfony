portal_superadmin_portal:
    resource: ../../src/Portals/SuperadminPortal/Controller/
    type: attribute
    exclude:
        - ../../src/Portals/SuperadminPortal/Controller/OperationsDataController.php
        - ../../src/Portals/SuperadminPortal/Controller/ScraperDataController.php
        - ../../src/Portals/SuperadminPortal/Controller/ScraperDbCompareController.php
        - ../../src/Portals/SuperadminPortal/Controller/ScraperDbDiffController.php
        - ../../src/Portals/SuperadminPortal/Controller/KnowledgeEntryApiController.php
        - ../../src/Portals/SuperadminPortal/Controller/ScraperSearchController.php
    condition: "request.attributes.get('_brand_system_type') == 'portal' and request.attributes.get('_brand_portal_key') == 'superadmin_portal'"

portal_superadmin_operations_api:
    resource: ../../src/Portals/SuperadminPortal/Controller/OperationsDataController.php
    type: attribute
    condition: "request.attributes.get('_brand_system_type') == 'superadmin' or (request.attributes.get('_brand_system_type') == 'portal' and request.attributes.get('_brand_portal_key') == 'superadmin_portal')"


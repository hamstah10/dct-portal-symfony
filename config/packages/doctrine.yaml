doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # Die Vektor-Tabelle des KI-Wissens gehört keiner Entity; ohne Filter würde sie bei jeder Schema-Migration gelöscht.
        schema_filter: '~^(?!ai_project_vector_document$)~'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
    

        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
            ChiptuningfilePortal:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Portals/Chiptuningfile/Entity'
                prefix: 'App\Portals\Chiptuningfile\Entity'
                alias: ChiptuningfilePortal
            No1tuningfilesPortal:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Portals/No1tuningfiles/Entity'
                prefix: 'App\Portals\No1tuningfiles\Entity'
                alias: No1tuningfilesPortal
            
            TuningfuxInstagramBundle:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/vendor/tuningfux/instagram-bundle/src/Entity'
                prefix: 'Tuningfux\InstagramBundle\Entity'
                alias: TuningfuxInstagramBundle
            TfdPartnerWizardBundle:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/vendor/tfd/partner-wizard-bundle/src/Entity'
                prefix: 'Tfd\PartnerWizardBundle\Entity'
                alias: TfdPartnerWizardBundle
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system

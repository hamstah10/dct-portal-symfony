<!-- @dsCard group="Portal" viewport="1440x820" name="Händler-Portal" subtitle="Neuer Auftrag Wizard · Alle Aufträge · Sidebar-Variante" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No1 Tuningfiles — Händler-Portal</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface-2); color: var(--text); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  a:hover { color: var(--accent-text); }
  #root { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
  .main { display: flex; flex-direction: column; min-width: 0; }
  .variant-toggle { position: fixed; bottom: 18px; right: 18px; z-index: 50; display: flex; gap: 8px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-pill); padding: 6px; box-shadow: var(--shadow-md); }
  .variant-toggle button { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; border: none; background: transparent; color: var(--text-muted); padding: 7px 14px; border-radius: var(--radius-pill); cursor: pointer; }
  .variant-toggle button.is-on { background: var(--accent); color: #fff; }
</style>
</head>
<body>
<div id="root"></div>
<div class="variant-toggle" id="variantToggle"></div>

<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="Topbar.jsx"></script>
<script type="text/babel" src="Stepper.jsx"></script>
<script type="text/babel" src="NewOrderScreen.jsx"></script>
<script type="text/babel" src="OrdersScreen.jsx"></script>
<script type="text/babel">
// Single React root for the portal screens, plus a small vanilla-rendered toggle for sidebar variant.
(function() {
  const root = document.getElementById('root');
  const toggleHost = document.getElementById('variantToggle');
  let variant = 'dark', screen = 'new-order';

  function renderToggle() {
    ReactDOM.createRoot(toggleHost).render(
      <React.Fragment>
        <button className={variant === 'dark' ? 'is-on' : ''} onClick={() => { variant = 'dark'; renderPortal(); renderToggle(); }}>Dunkle Sidebar</button>
        <button className={variant === 'light' ? 'is-on' : ''} onClick={() => { variant = 'light'; renderPortal(); renderToggle(); }}>Helle Sidebar</button>
      </React.Fragment>
    );
  }

  function Portal2() {
    const [scr, setScr] = React.useState(screen);
    React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
    const handleNav = (id) => {
      if (id === 'orders' || id === 'new-order') { screen = id; setScr(id); }
    };
    return (
      <React.Fragment>
        <Sidebar variant={variant} active={scr} onNavigate={handleNav} />
        <div className="main">
          <Topbar onBack={() => {}} />
          {scr === 'new-order' ? <NewOrderScreen /> : <OrdersScreen />}
        </div>
      </React.Fragment>
    );
  }

  let rootInst = null;
  function renderPortal() {
    if (!rootInst) rootInst = ReactDOM.createRoot(root);
    rootInst.render(<Portal2 />);
  }

  renderPortal();
  renderToggle();
})();
</script>
<template id="__bundler_thumbnail" data-bg-color="#1C1B1B">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#1C1B1B"/>
    <text x="380" y="430" font-family="Arial, sans-serif" font-weight="900" font-style="italic" font-size="300" fill="#FFFFFF">No</text>
    <text x="760" y="430" font-family="Arial, sans-serif" font-weight="900" font-style="italic" font-size="300" fill="#E31E24">1</text>
  </svg>
</template>
</body>
</html>
